name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality Check (Lint)
        run: npm run lint

      - name: Build Test
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.jm.j4corp.net/v1"
          NEXT_PUBLIC_WEB_SOCKET_URL: "wss://api.jm.j4corp.net"

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd /opt/motorsports/frontend
            git config --global --add safe.directory /opt/motorsports/frontend
            git reset --hard
            git clean -fd
            
            # Using GitHub PAT to pull from private repo
            git pull https://x-access-token:${{ secrets.GH_PAT }}@github.com/hrmrakib/j4Corp-AutoSync-Dashboard_V2.git main
            
            # Rebuild and restart the container
            docker-compose down
            docker-compose up -d --build
